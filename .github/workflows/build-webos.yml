name: Build Moonlight DualSense webOS IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out overlay project
        uses: actions/checkout@v4

      - name: Run protocol and overlay tests
        run: ./scripts/test.sh

      - name: Install ares packaging and verification tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential git python3

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1.12
        with:
          repository: webosbrew/ares-cli-rs
          latest: true
          fileName: ares-package_*_amd64.deb
          out-file-path: /tmp/webos-debs

      - name: Download Homebrew Toolbox
        uses: robinraju/release-downloader@v1.12
        with:
          repository: webosbrew/dev-toolbox-cli
          latest: true
          fileName: webosbrew-toolbox-*_amd64.deb
          out-file-path: /tmp/webos-debs

      - name: Install webOS packaging tools
        run: sudo apt-get install -y /tmp/webos-debs/*.deb

      - name: Download unofficial LG webOS ARM NDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: openlgtv/buildroot-nc4
          tag: webos-a38c582
          fileName: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          out-file-path: /tmp
          extract: true

      - name: Relocate webOS NDK
        working-directory: /tmp
        run: ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

      - name: Bootstrap Moonlight TV and build IPK
        env:
          CI: '1'
          TOOLCHAIN_FILE: /tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
        run: ./scripts/build-ipk.sh

      - name: Verify IPK presence
        run: test -n "$(find moonlight-tv-worktree/dist -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Verify IPK compatibility
        run: webosbrew-ipk-verify -f markdown -d -o "$GITHUB_STEP_SUMMARY" moonlight-tv-worktree/dist/*.ipk

      - name: Bundle corresponding source for publication
        run: |
          tar --exclude-vcs --exclude='build' --exclude='dist' --exclude='__pycache__' \
            -czf moonlight-dualsense-complete-source.tar.gz moonlight-tv-worktree
          test -s moonlight-dualsense-complete-source.tar.gz

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-webos-dualsense-source
          path: moonlight-dualsense-complete-source.tar.gz
          if-no-files-found: error

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-webos-dualsense-ipk
          path: moonlight-tv-worktree/dist/*.ipk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            moonlight-tv-worktree/dist/*.ipk
            moonlight-dualsense-complete-source.tar.gz
          generate_release_notes: true
